<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profesyonel Hava Durumu Konsolu</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-body: #f1f5f9;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #0ea5e9;
    --accent-light: #e0f2fe;
    --border: #e2e8f0;
  }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-body);
    color: var(--text-main);
    min-height: 100vh;
  }
  
  .card {
    background: var(--card-bg);
    border-radius: 1.5rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    border: 1px solid var(--border);
  }

  .model-tab {
    transition: all 0.2s;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
  }
  .model-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .day-btn {
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .day-btn:hover { background: var(--bg-body); }
  .day-btn.active {
    background: var(--accent-light);
    border-color: #bae6fd;
    box-shadow: inset 4px 0 0 var(--accent);
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  
  .hide-scroll::-webkit-scrollbar { display: none; }
  .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

  .fade-in { animation: fadeIn 0.4s ease-out forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="antialiased py-6 px-4 sm:px-6">

<div class="max-w-[1400px] mx-auto flex flex-col gap-6">

  <!-- Üst Menü / Model Seçici -->
  <header class="flex flex-col sm:flex-row items-center justify-between gap-4 card px-6 py-4">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-sky-500 text-white flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
      </div>
      <h1 class="text-xl font-bold text-slate-800 tracking-tight">Meteo<span class="text-sky-500">Pro</span></h1>
    </div>
    <div class="flex space-x-6">
      <button class="model-tab active pb-1 font-medium text-sm" data-model="gfs_seamless">GFS</button>
      <button class="model-tab pb-1 font-medium text-sm" data-model="ecmwf_ifs025">ECMWF</button>
      <button class="model-tab pb-1 font-medium text-sm" data-model="icon_seamless">ICON</button>
    </div>
  </header>

  <!-- Yükleniyor ve Hata Durumları -->
  <div id="loading-state" class="hidden py-12 text-center text-slate-500 flex flex-col items-center">
    <svg class="w-8 h-8 spin text-sky-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
    Veriler işleniyor...
  </div>
  <div id="error-state" class="hidden py-6 text-center text-red-600 card bg-red-50 border-red-200"></div>

  <!-- Ana İçerik Grid -->
  <div id="data-state" class="fade-in hidden grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- SOL KOLON: Arama, Anlık Durum ve Şehir Özeti -->
    <div class="lg:col-span-3 flex flex-col gap-6">
      <!-- Arama -->
      <div class="relative z-50">
        <div class="card flex items-center px-4 py-3 focus-within:ring-2 ring-sky-100 transition-all">
          <svg class="w-5 h-5 text-slate-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input id="city-input" type="text" placeholder="Şehir ara..." class="bg-transparent w-full outline-none text-slate-800 placeholder:text-slate-400" autocomplete="off" />
          <div id="search-spinner" class="hidden text-sky-500 spin"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></div>
        </div>
        <div id="results-list" class="hidden absolute top-full left-0 right-0 mt-2 card overflow-hidden shadow-xl max-h-60 overflow-y-auto z-50"></div>
      </div>

      <!-- Anlık Kahraman Kartı -->
      <div class="card bg-gradient-to-br from-sky-500 to-blue-600 text-white p-6 relative overflow-hidden">
        <div class="absolute -right-6 -top-6 opacity-10"><svg width="150" height="150" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg></div>
        <h2 class="text-2xl font-semibold mb-1" id="location-name">İstanbul</h2>
        <p class="text-sky-100 text-sm mb-6" id="current-date">--</p>
        <div class="flex items-center justify-between">
          <div>
            <div class="text-6xl font-bold tracking-tighter" id="current-temp">--°</div>
            <div class="text-lg font-medium text-sky-100 mt-2" id="current-cond">--</div>
          </div>
          <div id="current-icon" class="w-20 h-20 text-white drop-shadow-md"></div>
        </div>
      </div>

      <!-- Şehir Özeti Kartı -->
      <div class="card p-5">
        <h3 class="text-sm font-semibold text-slate-800 uppercase tracking-wider flex items-center gap-2 mb-3">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Şehir Özeti
        </h3>
        <p id="city-summary" class="text-sm text-slate-600 leading-relaxed">
          Bilgi yükleniyor...
        </p>
      </div>
    </div>

    <!-- ORTA KOLON: Seçili Günün Detayları ve Saatlik Veriler -->
    <div class="lg:col-span-6 flex flex-col gap-6">
      <div class="card p-6 flex flex-col h-full">
        <div class="flex justify-between items-end mb-6">
          <div>
            <h2 class="text-xl font-bold text-slate-800" id="middle-title">Bugün</h2>
            <p class="text-sm text-slate-500 mt-1" id="middle-subtitle">Günlük detaylı analiz</p>
          </div>
        </div>

        <!-- Detay Parametreleri -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
          <!-- Hissedilen / Min-Max -->
          <div class="bg-slate-50 rounded-2xl p-4 flex flex-col justify-center border border-slate-100">
            <div class="flex items-center gap-2 text-slate-500 mb-2">
              <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
              <span class="text-xs font-semibold uppercase tracking-wider" id="param-temp-label">Hissedilen</span>
            </div>
            <div class="text-2xl font-bold text-slate-800" id="param-temp-val">--°</div>
          </div>
          <!-- Rüzgar -->
          <div class="bg-slate-50 rounded-2xl p-4 flex flex-col justify-center border border-slate-100">
            <div class="flex items-center gap-2 text-slate-500 mb-2">
              <svg class="w-5 h-5 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span class="text-xs font-semibold uppercase tracking-wider">Rüzgar</span>
            </div>
            <div class="text-2xl font-bold text-slate-800" id="param-wind-val">--<span class="text-sm text-slate-500 font-normal ml-1">km/s</span></div>
          </div>
          <!-- Nem / Ortalama -->
          <div class="bg-slate-50 rounded-2xl p-4 flex flex-col justify-center border border-slate-100">
            <div class="flex items-center gap-2 text-slate-500 mb-2">
              <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
              <span class="text-xs font-semibold uppercase tracking-wider" id="param-hum-label">Nem</span>
            </div>
            <div class="text-2xl font-bold text-slate-800" id="param-hum-val">--%</div>
          </div>
          <!-- Yağış -->
          <div class="bg-slate-50 rounded-2xl p-4 flex flex-col justify-center border border-slate-100">
            <div class="flex items-center gap-2 text-slate-500 mb-2">
              <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
              <span class="text-xs font-semibold uppercase tracking-wider">Yağış</span>
            </div>
            <div class="text-2xl font-bold text-slate-800" id="param-precip-val">--<span class="text-sm text-slate-500 font-normal ml-1">mm</span></div>
          </div>
        </div>

        <!-- Saatlik Grafikler -->
        <div>
          <h3 class="text-sm font-semibold text-slate-800 uppercase tracking-wider mb-4">Saatlik Tahmin</h3>
          <div class="flex overflow-x-auto gap-3 pb-4 snap-x hide-scroll" id="hourly-container">
            <!-- JS Dolduracak -->
          </div>
        </div>

      </div>
    </div>

    <!-- SAĞ KOLON: 7 Günlük Tahmin -->
    <div class="lg:col-span-3">
      <div class="card p-4">
        <h3 class="text-sm font-semibold text-slate-800 uppercase tracking-wider p-2 mb-2 flex items-center">
          <svg class="w-5 h-5 mr-2 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          7 Günlük Tahmin
        </h3>
        <div id="forecast-list" class="flex flex-col gap-1">
          <!-- JS Dolduracak -->
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  // Profesyonel Renkli SVG İkonlar
  const ICONS = {
    sun: `<svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.5"><circle cx="12" cy="12" r="5" fill="#fef3c7"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>`,
    cloudSun: `<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 14a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 16H8a4 4 0 01-4-2z" fill="#f1f5f9"/><path stroke-linecap="round" stroke-linejoin="round" stroke="#f59e0b" d="M17.5 4.5l1.4-1.4M22 9h-2M18.9 13.5l1.4 1.4M3 9h2"/></svg>`,
    cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 15a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 17H8a4 4 0 01-4-2z" fill="#e2e8f0"/></svg>`,
    rain: `<svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 14a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 16H8a4 4 0 01-4-2z" stroke="#64748b" fill="#e2e8f0"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 18v2M12 18v4M16 18v2"/></svg>`,
    snow: `<svg viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 14a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 16H8a4 4 0 01-4-2z" stroke="#64748b" fill="#e2e8f0"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 19h.01M12 21h.01M16 19h.01M12 17h.01"/></svg>`,
    thunder: `<svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 14a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 16H8a4 4 0 01-4-2z" stroke="#64748b" fill="#e2e8f0"/><path stroke-linecap="round" stroke-linejoin="round" d="M13 16l-3 4h4l-3 4"/></svg>`,
    fog: `<svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 12h16M4 16h16M6 8h12"/></svg>`
  };

  const ICONS_WHITE = Object.fromEntries(
    Object.entries(ICONS).map(([k, v]) => [k, v.replace(/stroke="#[a-f0-9]+"/g, 'stroke="currentColor"').replace(/fill="#[a-f0-9]+"/g, 'fill="none"')])
  );

  const WMO = {
    0:['Açık', ICONS.sun, ICONS_WHITE.sun], 1:['Az Bulutlu', ICONS.cloudSun, ICONS_WHITE.cloudSun], 2:['Parçalı Bulutlu', ICONS.cloudSun, ICONS_WHITE.cloudSun], 3:['Çok Bulutlu', ICONS.cloud, ICONS_WHITE.cloud],
    45:['Sisli', ICONS.fog, ICONS_WHITE.fog], 48:['Kırağı Sisi', ICONS.fog, ICONS_WHITE.fog],
    51:['Hafif Çisenti', ICONS.rain, ICONS_WHITE.rain], 53:['Çisenti', ICONS.rain, ICONS_WHITE.rain], 55:['Yoğun Çisenti', ICONS.rain, ICONS_WHITE.rain],
    61:['Hafif Yağmur', ICONS.rain, ICONS_WHITE.rain], 63:['Yağmurlu', ICONS.rain, ICONS_WHITE.rain], 65:['Şiddetli Yağmur', ICONS.rain, ICONS_WHITE.rain],
    71:['Hafif Kar', ICONS.snow, ICONS_WHITE.snow], 73:['Kar Yağışlı', ICONS.snow, ICONS_WHITE.snow], 75:['Yoğun Kar', ICONS.snow, ICONS_WHITE.snow], 77:['Kar', ICONS.snow, ICONS_WHITE.snow],
    80:['Sağanak', ICONS.rain, ICONS_WHITE.rain], 81:['Kuvv. Sağanak', ICONS.rain, ICONS_WHITE.rain], 82:['Şid. Sağanak', ICONS.rain, ICONS_WHITE.rain],
    95:['Fırtına', ICONS.thunder, ICONS_WHITE.thunder], 96:['Dolu', ICONS.thunder, ICONS_WHITE.thunder], 99:['Şid. Dolu', ICONS.thunder, ICONS_WHITE.thunder]
  };

  let state = {
    lat: 41.0082, lon: 28.9784, name: 'İstanbul', country: 'Türkiye',
    model: 'gfs_seamless',
    selectedDayIndex: 0,
    currentData: null,
    cache: {}
  };

  const $ = (id) => document.getElementById(id);

  function getSafe(obj, key) {
    if (!obj) return null;
    if (obj[key] !== undefined) return obj[key];
    const fk = Object.keys(obj).find(k => k.startsWith(key + '_'));
    return fk ? obj[fk] : null;
  }

  function showState(s){
    $('loading-state').classList.toggle('hidden', s !== 'loading');
    $('error-state').classList.toggle('hidden', s !== 'error');
    $('data-state').classList.toggle('hidden', s !== 'data');
  }

  async function fetchCitySummary(city) {
    $('city-summary').innerHTML = '<span class="text-slate-400">Wikipedia aranıyor...</span>';
    try {
      const res = await fetch(`https://tr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(city)}`);
      if(res.ok) {
        const data = await res.json();
        if(data.extract) {
          let text = data.extract;
          return text.length > 200 ? text.substring(0, 200) + '...' : text;
        }
      }
    } catch(e) {}
    return `${city}, güncel hava durumu modelleri ile takip edilen bir lokasyondur. İlgili sıcaklık ve rüzgar verileri seçili algoritmalar tarafından hesaplanmaktadır.`;
  }

  let searchTimer;
  $('city-input').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if(q.length < 2) { 
      $('results-list').classList.add('hidden');
      $('search-spinner').classList.add('hidden');
      return; 
    }
    $('search-spinner').classList.remove('hidden');
    
    searchTimer = setTimeout(async () => {
      try {
        const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=tr&format=json`;
        const res = await fetch(url);
        if(!res.ok) throw new Error();
        const json = await res.json();
        renderSearch(json.results || []);
      } catch (err) {
        $('results-list').innerHTML = `<div class="p-4 text-sm text-red-500">Arama başarısız.</div>`;
        $('results-list').classList.remove('hidden');
      } finally {
        $('search-spinner').classList.add('hidden');
      }
    }, 450);
  });

  function renderSearch(results){
    const box = $('results-list');
    if(!results.length){
      box.innerHTML = `<div class="p-4 text-sm text-slate-500">Sonuç bulunamadı.</div>`;
      box.classList.remove('hidden');
      return;
    }
    box.innerHTML = results.map((r, i) => `
      <button data-idx="${i}" class="search-item w-full text-left px-4 py-3 hover:bg-slate-50 border-b border-slate-100 last:border-b-0 transition-colors">
        <div class="text-sm font-semibold text-slate-800">${r.name}</div>
        <div class="text-xs text-slate-500 mt-0.5">${r.admin1 ? r.admin1 + ', ' : ''}${r.country || ''}</div>
      </button>
    `).join('');
    box.classList.remove('hidden');

    box.querySelectorAll('.search-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = results[Number(btn.dataset.idx)];
        state.lat = r.latitude;
        state.lon = r.longitude;
        state.name = r.name;
        state.country = r.country || '';
        box.classList.add('hidden');
        $('city-input').value = '';
        loadWeather();
      });
    });
  }

  document.addEventListener('click', (e) => {
    if(!e.target.closest('#results-list') && !e.target.closest('#city-input')){
      $('results-list').classList.add('hidden');
    }
  });

  async function fetchWeather(model){
    const key = `${state.lat.toFixed(3)},${state.lon.toFixed(3)},${model}`;
    if(state.cache[key]) return state.cache[key];

    const params = new URLSearchParams({
      latitude: state.lat,
      longitude: state.lon,
      current: 'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,precipitation,weather_code',
      hourly: 'temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max',
      forecast_days: 7,
      timezone: 'auto',
      models: model
    });
    
    const url = `https://api.open-meteo.com/v1/forecast?${params.toString()}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('API Yanıt Vermedi');
    const json = await res.json();
    state.cache[key] = json;
    return json;
  }

  async function renderApp(data) {
    state.currentData = data;
    
    const cur = data.current || {};
    const wCode = getSafe(cur, 'weather_code');
    const cond = (wCode !== null && WMO[wCode]) ? WMO[wCode] : ['Bilinmiyor', ICONS.sun, ICONS_WHITE.sun];
    const temp = getSafe(cur, 'temperature_2m');
    
    $('location-name').textContent = state.name;
    $('current-date').textContent = new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
    $('current-temp').textContent = temp !== null ? Math.round(temp) + '°' : '--°';
    $('current-cond').textContent = cond[0];
    $('current-icon').innerHTML = cond[2]; 

    const summary = await fetchCitySummary(state.name);
    $('city-summary').innerHTML = summary;

    renderRightPanel();
    renderMiddlePanel(state.selectedDayIndex);
  }

  function renderRightPanel() {
    const daily = state.currentData.daily || {};
    const days = getSafe(daily, 'time') || [];
    const maxes = getSafe(daily, 'temperature_2m_max') || [];
    const mins = getSafe(daily, 'temperature_2m_min') || [];
    const codes = getSafe(daily, 'weather_code') || [];

    $('forecast-list').innerHTML = days.map((d, i) => {
      let dayName = new Date(d).toLocaleDateString('tr-TR', { weekday: 'short' });
      if(i === 0) dayName = 'Bugün';
      
      const dayCond = WMO[codes[i]] || ['?', ICONS.sun];
      const isActive = i === state.selectedDayIndex ? 'active' : '';
      
      const cMin = mins[i] !== undefined && mins[i] !== null ? Math.round(mins[i]) + '°' : '--';
      const cMax = maxes[i] !== undefined && maxes[i] !== null ? Math.round(maxes[i]) + '°' : '--';

      return `
        <button onclick="selectDay(${i})" class="day-btn ${isActive} w-full flex items-center justify-between p-3 rounded-xl cursor-pointer text-sm">
          <span class="w-16 text-left font-medium text-slate-700">${dayName}</span>
          <div class="w-8 h-8 flex justify-center items-center">${dayCond[1]}</div>
          <div class="w-20 text-right flex justify-end gap-2">
            <span class="text-slate-400">${cMin}</span>
            <span class="font-semibold text-slate-800">${cMax}</span>
          </div>
        </button>
      `;
    }).join('');
  }

  window.selectDay = function(index) {
    state.selectedDayIndex = index;
    renderRightPanel();
    renderMiddlePanel(index);
  }

  function renderMiddlePanel(dayIndex) {
    const data = state.currentData;
    const cur = data.current || {};
    const daily = data.daily || {};
    const hourly = data.hourly || {};
    
    const dates = getSafe(daily, 'time') || [];
    const targetDate = dates[dayIndex] ? new Date(dates[dayIndex]) : new Date();
    
    if(dayIndex === 0) {
      $('middle-title').textContent = 'Bugün';
      $('middle-subtitle').textContent = 'Anlık ve saatlik detaylar';
      
      const appTemp = getSafe(cur, 'apparent_temperature');
      const windSpeed = getSafe(cur, 'wind_speed_10m');
      const relHum = getSafe(cur, 'relative_humidity_2m');
      const precip = getSafe(cur, 'precipitation');

      $('param-temp-label').textContent = 'Hissedilen';
      $('param-temp-val').textContent = appTemp !== null ? Math.round(appTemp) + '°' : '--°';
      $('param-wind-val').innerHTML = windSpeed !== null ? `${Math.round(windSpeed)}<span class="text-sm text-slate-500 font-normal ml-1">km/s</span>` : '--';
      $('param-hum-label').textContent = 'Anlık Nem';
      $('param-hum-val').textContent = relHum !== null ? Math.round(relHum) + '%' : '--%';
      $('param-precip-val').innerHTML = precip !== null ? `${precip.toFixed(1)}<span class="text-sm text-slate-500 font-normal ml-1">mm</span>` : '--';
    } else {
      $('middle-title').textContent = targetDate.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
      $('middle-subtitle').textContent = 'Günlük özet ve saatlik tahmin';
      
      const dMin = (getSafe(daily, 'temperature_2m_min') || [])[dayIndex];
      const dMax = (getSafe(daily, 'temperature_2m_max') || [])[dayIndex];
      const dWind = (getSafe(daily, 'wind_speed_10m_max') || [])[dayIndex];
      const dPrecip = (getSafe(daily, 'precipitation_sum') || [])[dayIndex];

      $('param-temp-label').textContent = 'Min - Max';
      $('param-temp-val').textContent = (dMin !== undefined && dMax !== undefined) ? `${Math.round(dMin)}° / ${Math.round(dMax)}°` : '--°';
      $('param-wind-val').innerHTML = dWind !== undefined ? `${Math.round(dWind)}<span class="text-sm text-slate-500 font-normal ml-1">Maks</span>` : '--';
      $('param-hum-label').textContent = 'Tahmini';
      $('param-hum-val').textContent = '--'; 
      $('param-precip-val').innerHTML = dPrecip !== undefined ? `${dPrecip.toFixed(1)}<span class="text-sm text-slate-500 font-normal ml-1">mm</span>` : '--';
    }

    const hTime = getSafe(hourly, 'time') || [];
    const hTemp = getSafe(hourly, 'temperature_2m') || [];
    const hCode = getSafe(hourly, 'weather_code') || [];
    const hWind = getSafe(hourly, 'wind_speed_10m') || [];
    
    const startIndex = dayIndex * 24;
    const endIndex = startIndex + 24;
    
    let hourlyHTML = '';
    const currentHour = new Date().getHours();

    for(let i = startIndex; i < endIndex; i++) {
      if(!hTime[i]) break;
      const hourDate = new Date(hTime[i]);
      const hourNum = hourDate.getHours();
      const timeStr = hourNum.toString().padStart(2, '0') + ':00';
      
      const wC = WMO[hCode[i]] || ['?', ICONS.sun];
      
      const isPast = (dayIndex === 0 && hourNum < currentHour);
      const op = isPast ? 'opacity-50' : 'opacity-100';
      const bg = (dayIndex === 0 && hourNum === currentHour) ? 'bg-sky-50 border-sky-200' : 'bg-white border-slate-100';

      const hT = hTemp[i] !== null ? Math.round(hTemp[i]) + '°' : '-';
      const hW = hWind[i] !== null ? Math.round(hWind[i]) : '-';

      hourlyHTML += `
        <div class="min-w-[80px] p-4 flex flex-col items-center justify-center border rounded-2xl snap-center shrink-0 ${op} ${bg} transition-colors">
          <span class="text-xs text-slate-500 font-medium mb-2">${timeStr}</span>
          <div class="w-8 h-8 mb-2">${wC[1]}</div>
          <span class="text-lg font-bold text-slate-800 mb-1">${hT}</span>
          <span class="text-[10px] text-slate-400">${hW} km/s</span>
        </div>
      `;
    }
    
    const container = $('hourly-container');
    container.innerHTML = hourlyHTML;
    
    if(dayIndex === 0) {
      setTimeout(() => {
        const itemWidth = 80 + 12;
        container.scrollTo({ left: Math.max(0, (currentHour - 1) * itemWidth), behavior: 'smooth' });
      }, 100);
    } else {
      container.scrollTo({ left: 0, behavior: 'smooth' });
    }
  }

  async function loadWeather(){
    showState('loading');
    state.selectedDayIndex = 0; 
    try {
      const data = await fetchWeather(state.model);
      await renderApp(data);
      // Eksik olan o sihirli satır burası! Başarıyla render edildikten sonra loading ekranını kaldırıyor.
      showState('data'); 
    } catch(err) {
      $('error-state').textContent = 'Sistem Hatası: Verilere ulaşılamıyor. Lütfen tekrar deneyin.';
      showState('error');
    }
  }

  document.querySelectorAll('.model-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.model-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.model = btn.dataset.model;
      loadWeather();
    });
  });

  loadWeather();
})();
</script>
</body>
</html>
