<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Profesyonel Hava Durumu Konsolu</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --text-main: #0f172a;
    --accent: #0ea5e9;
  }
  
  body {
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    background-color: #e2e8f0;
  }

  /* Dinamik Arka Plan */
  #weather-fx {
    position: fixed; inset: 0; z-index: -1;
    transition: background 1s ease;
    overflow: hidden;
  }
  .theme-clear { background: linear-gradient(135deg, #7dd3fc, #bae6fd); }
  .theme-cloudy { background: linear-gradient(135deg, #cbd5e1, #e2e8f0); }
  .theme-rain { background: linear-gradient(135deg, #64748b, #94a3b8); }
  .theme-snow { background: linear-gradient(135deg, #e2e8f0, #f8fafc); }
  .theme-thunder { background: linear-gradient(135deg, #475569, #64748b); animation: lightning 5s infinite; }
  .theme-fog { background: linear-gradient(135deg, #cbd5e1, #d1d5db); filter: blur(2px); }

  @keyframes lightning {
    0%, 95%, 98% { filter: brightness(1); }
    96%, 99% { filter: brightness(1.8); }
  }

  /* Parçacıklar */
  .sun-flare {
    position: absolute; top: -10%; right: -10%; width: 50vw; height: 50vw; max-width: 300px; max-height: 300px;
    background: radial-gradient(circle, rgba(253,224,71,0.6) 0%, transparent 60%);
    animation: pulse 4s infinite alternate;
  }
  @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
  
  .raindrop { position: absolute; width: 2px; height: 30px; background: rgba(255,255,255,0.4); animation: fall linear infinite; }
  .snowflake { position: absolute; width: 6px; height: 6px; background: white; border-radius: 50%; animation: fall linear infinite; }
  @keyframes fall {
    0% { transform: translateY(-10vh); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
  }
  
  /* Glassmorphism */
  .glass-panel {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    border-radius: 1.25rem;
  }

  .glass-input {
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.9);
  }

  /* Modeller ve Gün Butonları */
  .model-tab { transition: all 0.2s; color: #475569; border-bottom: 2px solid transparent; white-space: nowrap; }
  .model-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .day-btn { transition: all 0.2s; border: 1px solid transparent; }
  .day-btn:hover { background: rgba(255,255,255,0.7); }
  .day-btn.active { background: rgba(255,255,255,1); border-color: #bae6fd; box-shadow: inset 4px 0 0 var(--accent); }

  /* Görünür Scrollbar */
  .custom-scroll { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
  .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
  .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.5); border-radius: 8px; }
  .custom-scroll::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.2); border-radius: 8px; }
  
  .fade-in { animation: fadeIn 0.4s ease-out forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="antialiased py-4 sm:py-6 px-3 sm:px-6 relative">

<div id="weather-fx" class="theme-clear"></div>

<div class="max-w-[1400px] mx-auto flex flex-col gap-4 sm:gap-6 relative z-10">

  <!-- Üst Menü -->
  <header class="glass-panel px-4 sm:px-6 py-4 flex flex-col lg:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-2 w-full lg:w-auto justify-center lg:justify-start">
      <div class="w-8 h-8 rounded-lg bg-sky-500 text-white flex items-center justify-center shadow-md shrink-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
      </div>
      <h1 class="text-xl font-bold text-slate-800 tracking-tight">Meteo<span class="text-sky-500">Pro</span></h1>
    </div>
    
    <!-- Arama Çubuğu -->
    <div class="relative w-full max-w-lg z-[100]">
      <div class="glass-input flex items-center px-4 py-2.5 rounded-xl focus-within:ring-2 ring-sky-400 transition-all shadow-sm">
        <svg class="w-5 h-5 text-slate-500 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input id="city-input" type="text" placeholder="Şehir ara... (Örn: İstanbul)" class="bg-transparent w-full outline-none text-slate-800 placeholder:text-slate-500 font-medium text-[16px]" autocomplete="off" />
        <div id="search-spinner" class="hidden text-sky-500 spin shrink-0"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></div>
      </div>
      <!-- Şeffaflığı azaltılmış, tam görünür arama sonuçları -->
      <div id="results-list" class="hidden absolute top-full left-0 right-0 mt-2 bg-white/95 backdrop-blur-2xl border border-slate-200 overflow-hidden shadow-2xl rounded-xl max-h-60 overflow-y-auto p-1 z-[999]"></div>
    </div>

    <!-- Modeller (Mobilde yana kaydırılabilir) -->
    <div class="flex space-x-4 sm:space-x-6 w-full lg:w-auto justify-center lg:justify-end overflow-x-auto custom-scroll pb-1">
      <button class="model-tab active pb-1 text-sm shrink-0" data-model="gfs_seamless">GFS</button>
      <button class="model-tab pb-1 text-sm shrink-0" data-model="ecmwf_ifs025">ECMWF</button>
      <button class="model-tab pb-1 text-sm shrink-0" data-model="icon_seamless">ICON</button>
    </div>
  </header>

  <div id="loading-state" class="hidden py-16 text-center text-slate-600 flex flex-col items-center glass-panel">
    <svg class="w-8 h-8 spin text-sky-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
    Veriler işleniyor...
  </div>
  <div id="error-state" class="hidden py-6 text-center text-red-600 glass-panel bg-red-50/90 border-red-200 font-medium"></div>

  <!-- Ana Grid -->
  <div id="data-state" class="fade-in hidden grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
    
    <!-- SOL KOLON -->
    <div class="lg:col-span-3 flex flex-col gap-4 sm:gap-6">
      
      <!-- Ana Kart -->
      <div class="glass-panel bg-gradient-to-br from-sky-500/95 to-blue-600/95 text-white p-5 sm:p-6 relative overflow-hidden shadow-xl border-0">
        <h2 class="text-3xl font-bold mb-1 tracking-tight" id="location-name">İstanbul</h2>
        <p class="text-sky-100 text-sm mb-6 font-medium" id="current-date">--</p>
        <div class="flex items-center justify-between">
          <div>
            <div class="text-6xl sm:text-7xl font-extrabold tracking-tighter drop-shadow-md" id="current-temp">--°</div>
            <div class="text-lg sm:text-xl font-medium text-sky-100 mt-1" id="current-cond">--</div>
          </div>
          <div id="current-icon" class="w-20 h-20 sm:w-24 sm:h-24 text-white drop-shadow-lg shrink-0"></div>
        </div>
      </div>

      <!-- Günlük Özet Metni -->
      <div class="glass-panel p-4 sm:p-5">
        <h3 class="text-[13px] font-bold text-slate-800 uppercase tracking-wider flex items-center gap-2 mb-3">
          <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Günlük Özet
        </h3>
        <p id="daily-summary-text" class="text-sm text-slate-700 leading-relaxed font-medium">--</p>
      </div>

      <!-- Ekstra Göstergeler (YENİ) -->
      <div class="glass-panel p-4 sm:p-5">
        <h3 class="text-[13px] font-bold text-slate-800 uppercase tracking-wider flex items-center gap-2 mb-4">
          <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
          Günün Detayları
        </h3>
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white/60 rounded-xl p-3 border border-white/80">
            <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">UV Endeksi</div>
            <div class="text-sm font-bold text-slate-800" id="extra-uv">--</div>
          </div>
          <div class="bg-white/60 rounded-xl p-3 border border-white/80">
            <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">Hava Kalitesi</div>
            <div class="text-sm font-bold text-slate-800" id="extra-aqi">--</div>
          </div>
          <div class="bg-white/60 rounded-xl p-3 border border-white/80">
            <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">Yağış Süresi</div>
            <div class="text-sm font-bold text-slate-800" id="extra-rainh">--</div>
          </div>
          <div class="bg-white/60 rounded-xl p-3 border border-white/80">
            <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">Yıldırım Riske</div>
            <div class="text-sm font-bold text-slate-800" id="extra-thunder">--</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ORTA KOLON -->
    <div class="lg:col-span-6 flex flex-col gap-4 sm:gap-6 overflow-hidden">
      <div class="glass-panel p-4 sm:p-6 flex flex-col w-full">
        
        <div class="mb-5">
          <h2 class="text-xl sm:text-2xl font-bold text-slate-800" id="middle-title">Bugün</h2>
          <p class="text-xs sm:text-sm text-slate-500 mt-1 font-medium" id="middle-subtitle">Günlük analiz</p>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mb-6 sm:mb-8">
          <div class="bg-white/60 rounded-2xl p-3 flex flex-col justify-center border border-white/80">
            <div class="flex items-center gap-1.5 text-slate-500 mb-1.5">
              <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
              <span class="text-[10px] font-bold uppercase" id="param-temp-label">Hissedilen</span>
            </div>
            <div class="text-xl sm:text-2xl font-bold text-slate-800" id="param-temp-val">--°</div>
          </div>
          <div class="bg-white/60 rounded-2xl p-3 flex flex-col justify-center border border-white/80">
            <div class="flex items-center gap-1.5 text-slate-500 mb-1.5">
              <svg class="w-4 h-4 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span class="text-[10px] font-bold uppercase">Rüzgar</span>
            </div>
            <div class="text-xl sm:text-2xl font-bold text-slate-800" id="param-wind-val">--</div>
          </div>
          <div class="bg-white/60 rounded-2xl p-3 flex flex-col justify-center border border-white/80">
            <div class="flex items-center gap-1.5 text-slate-500 mb-1.5">
              <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
              <span class="text-[10px] font-bold uppercase" id="param-hum-label">Nem</span>
            </div>
            <div class="text-xl sm:text-2xl font-bold text-slate-800" id="param-hum-val">--%</div>
          </div>
          <div class="bg-white/60 rounded-2xl p-3 flex flex-col justify-center border border-white/80">
            <div class="flex items-center gap-1.5 text-slate-500 mb-1.5">
              <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
              <span class="text-[10px] font-bold uppercase">Yağış</span>
            </div>
            <div class="text-xl sm:text-2xl font-bold text-slate-800" id="param-precip-val">--</div>
          </div>
        </div>

        <div class="mb-6 sm:mb-8 w-full">
          <h3 class="text-[12px] font-bold text-slate-800 uppercase tracking-wider mb-3">Saatlik Tahmin</h3>
          <div class="flex overflow-x-auto gap-3 pb-3 snap-x custom-scroll w-full" id="hourly-container">
            <!-- JS -->
          </div>
        </div>
        
        <!-- Radar Ekranı Güncellendi -->
        <div class="w-full">
          <h3 class="text-[12px] font-bold text-slate-800 uppercase tracking-wider mb-3 flex items-center">
            <svg class="w-4 h-4 mr-1.5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            Canlı Hava Radarı & Zaman Çizelgesi
          </h3>
          <div class="rounded-2xl overflow-hidden border border-white/80 shadow-sm bg-slate-200">
            <iframe id="radar-iframe" class="w-full h-[260px] sm:h-[320px] bg-slate-200" src="" frameborder="0"></iframe>
          </div>
        </div>

      </div>
    </div>

    <!-- SAĞ KOLON -->
    <div class="lg:col-span-3">
      <div class="glass-panel p-4">
        <h3 class="text-[13px] font-bold text-slate-800 uppercase tracking-wider p-2 mb-2 flex items-center">
          <svg class="w-4 h-4 mr-2 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          7 Günlük Tahmin
        </h3>
        <div id="forecast-list" class="flex flex-col gap-1"></div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const ICONS = {
    sun: `<svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.5"><circle cx="12" cy="12" r="5" fill="#fef3c7"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>`,
    cloudSun: `<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 14a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 16H8a4 4 0 01-4-2z" fill="#f1f5f9"/><path stroke-linecap="round" stroke-linejoin="round" stroke="#f59e0b" d="M17.5 4.5l1.4-1.4M22 9h-2M18.9 13.5l1.4 1.4M3 9h2"/></svg>`,
    cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 15a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 17H8a4 4 0 01-4-2z" fill="#e2e8f0"/></svg>`,
    rain: `<svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 14a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 16H8a4 4 0 01-4-2z" stroke="#64748b" fill="#e2e8f0"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 18v2M12 18v4M16 18v2"/></svg>`,
    snow: `<svg viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 14a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 16H8a4 4 0 01-4-2z" stroke="#64748b" fill="#e2e8f0"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 19h.01M12 21h.01M16 19h.01M12 17h.01"/></svg>`,
    thunder: `<svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 14a4 4 0 014-4 4 4 0 016.9-2.75A5 5 0 1118 16H8a4 4 0 01-4-2z" stroke="#64748b" fill="#e2e8f0"/><path stroke-linecap="round" stroke-linejoin="round" d="M13 16l-3 4h4l-3 4"/></svg>`,
    fog: `<svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 12h16M4 16h16M6 8h12"/></svg>`
  };
  const ICONS_WHITE = Object.fromEntries(
    Object.entries(ICONS).map(([k, v]) => [k, v.replace(/stroke="#[a-f0-9]+"/g, 'stroke="currentColor"').replace(/fill="#[a-f0-9]+"/g, 'fill="none"')])
  );

  const WMO = {
    0:['Açık', ICONS.sun, ICONS_WHITE.sun, 'clear'], 1:['Az Bulutlu', ICONS.cloudSun, ICONS_WHITE.cloudSun, 'clear'], 2:['Parçalı Bulutlu', ICONS.cloudSun, ICONS_WHITE.cloudSun, 'cloudy'], 3:['Çok Bulutlu', ICONS.cloud, ICONS_WHITE.cloud, 'cloudy'],
    45:['Sisli', ICONS.fog, ICONS_WHITE.fog, 'fog'], 48:['Kırağı Sisi', ICONS.fog, ICONS_WHITE.fog, 'fog'],
    51:['Hafif Çisenti', ICONS.rain, ICONS_WHITE.rain, 'rain'], 53:['Çisenti', ICONS.rain, ICONS_WHITE.rain, 'rain'], 55:['Yoğun Çisenti', ICONS.rain, ICONS_WHITE.rain, 'rain'],
    61:['Hafif Yağmur', ICONS.rain, ICONS_WHITE.rain, 'rain'], 63:['Yağmurlu', ICONS.rain, ICONS_WHITE.rain, 'rain'], 65:['Şiddetli Yağmur', ICONS.rain, ICONS_WHITE.rain, 'rain'],
    71:['Hafif Kar', ICONS.snow, ICONS_WHITE.snow, 'snow'], 73:['Kar Yağışlı', ICONS.snow, ICONS_WHITE.snow, 'snow'], 75:['Yoğun Kar', ICONS.snow, ICONS_WHITE.snow, 'snow'], 77:['Kar', ICONS.snow, ICONS_WHITE.snow, 'snow'],
    80:['Sağanak', ICONS.rain, ICONS_WHITE.rain, 'rain'], 81:['Kuvv. Sağanak', ICONS.rain, ICONS_WHITE.rain, 'rain'], 82:['Şid. Sağanak', ICONS.rain, ICONS_WHITE.rain, 'rain'],
    95:['Fırtına', ICONS.thunder, ICONS_WHITE.thunder, 'thunder'], 96:['Dolu', ICONS.thunder, ICONS_WHITE.thunder, 'thunder'], 99:['Şid. Dolu', ICONS.thunder, ICONS_WHITE.thunder, 'thunder']
  };

  let state = {
    lat: 41.0082, lon: 28.9784, name: 'İstanbul', country: 'Türkiye',
    model: 'gfs_seamless', selectedDayIndex: 0, currentData: null, cache: {}
  };

  const $ = (id) => document.getElementById(id);

  function getSafe(obj, key) {
    if (!obj) return null;
    if (obj[key] !== undefined) return obj[key];
    const fk = Object.keys(obj).find(k => k.startsWith(key + '_'));
    return fk ? obj[fk] : null;
  }

  function showState(s){
    $('loading-state').classList.toggle('hidden', s !== 'loading');
    $('error-state').classList.toggle('hidden', s !== 'error');
    $('data-state').classList.toggle('hidden', s !== 'data');
  }

  function setWeatherFX(type) {
    const bg = $('weather-fx');
    bg.className = `theme-${type}`;
    bg.innerHTML = ''; 
    if (type === 'clear') { bg.innerHTML = '<div class="sun-flare"></div>'; } 
    else if (type === 'rain' || type === 'thunder') {
      for(let i=0; i<30; i++) {
        let drop = document.createElement('div');
        drop.className = 'raindrop'; drop.style.left = Math.random() * 100 + 'vw';
        drop.style.animationDuration = (Math.random() * 0.3 + 0.4) + 's'; drop.style.animationDelay = Math.random() * 2 + 's';
        bg.appendChild(drop);
      }
    } 
    else if (type === 'snow') {
      for(let i=0; i<40; i++) {
        let flake = document.createElement('div');
        flake.className = 'snowflake'; flake.style.left = Math.random() * 100 + 'vw';
        flake.style.animationDuration = (Math.random() * 3 + 3) + 's'; flake.style.animationDelay = Math.random() * 5 + 's';
        bg.appendChild(flake);
      }
    }
  }

  // Şehir Arama
  let searchTimer;
  $('city-input').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if(q.length < 2) { $('results-list').classList.add('hidden'); $('search-spinner').classList.add('hidden'); return; }
    $('search-spinner').classList.remove('hidden');
    searchTimer = setTimeout(async () => {
      try {
        const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=tr&format=json`;
        const res = await fetch(url);
        const json = await res.json();
        renderSearch(json.results || []);
      } catch (err) {
        $('results-list').innerHTML = `<div class="p-3 text-sm text-red-500 font-bold">Arama başarısız.</div>`;
        $('results-list').classList.remove('hidden');
      } finally { $('search-spinner').classList.add('hidden'); }
    }, 450);
  });

  function renderSearch(results){
    const box = $('results-list');
    if(!results.length){
      box.innerHTML = `<div class="p-3 text-sm text-slate-500 font-bold">Sonuç bulunamadı.</div>`;
      box.classList.remove('hidden'); return;
    }
    box.innerHTML = results.map((r, i) => `
      <button data-idx="${i}" class="search-item w-full text-left px-4 py-3 hover:bg-slate-100 border-b border-slate-200 last:border-0 transition-colors">
        <div class="text-sm font-bold text-slate-800">${r.name}</div>
        <div class="text-xs text-slate-500 mt-0.5 font-medium">${r.admin1 ? r.admin1 + ', ' : ''}${r.country || ''}</div>
      </button>
    `).join('');
    box.classList.remove('hidden');
    box.querySelectorAll('.search-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = results[Number(btn.dataset.idx)];
        state.lat = r.latitude; state.lon = r.longitude; state.name = r.name; state.country = r.country || '';
        box.classList.add('hidden'); $('city-input').value = '';
        loadWeather();
      });
    });
  }

  document.addEventListener('click', (e) => {
    if(!e.target.closest('#results-list') && !e.target.closest('#city-input')){ $('results-list').classList.add('hidden'); }
  });

  async function fetchWeather(model){
    const key = `${state.lat.toFixed(3)},${state.lon.toFixed(3)},${model}`;
    if(state.cache[key]) return state.cache[key];

    // UV, Yağış saati eklendi
    const params = new URLSearchParams({
      latitude: state.lat, longitude: state.lon,
      current: 'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,precipitation,weather_code',
      hourly: 'temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,uv_index_max,precipitation_hours',
      forecast_days: 7, timezone: 'auto', models: model
    });
    
    const wUrl = `https://api.open-meteo.com/v1/forecast?${params.toString()}`;
    const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${state.lat}&longitude=${state.lon}&hourly=european_aqi&timezone=auto`;

    const [wRes, aqiRes] = await Promise.all([ fetch(wUrl).catch(()=>null), fetch(aqiUrl).catch(()=>null) ]);
    if(!wRes || !wRes.ok) throw new Error();
    
    const data = await wRes.json();
    try { data.aqi_data = await aqiRes.json(); } catch(e){ data.aqi_data = null; }
    
    state.cache[key] = data;
    return data;
  }

  function getThunderRisk(code) {
    if([95,96,99].includes(code)) return "Yüksek (Yoğun)";
    if([80,81,82].includes(code)) return "Orta (Olası)";
    return "Beklenmiyor";
  }

  function getAqiLabel(val) {
    if(val == null) return "--";
    if(val <= 20) return `İyi (${val})`;
    if(val <= 40) return `Orta (${val})`;
    if(val <= 60) return `Hassas (${val})`;
    if(val <= 80) return `Kötü (${val})`;
    return `Çok Kötü (${val})`;
  }

  function renderApp(data) {
    state.currentData = data;
    
    const cur = data.current || {};
    const wCode = getSafe(cur, 'weather_code');
    const condData = (wCode !== null && WMO[wCode]) ? WMO[wCode] : ['Bilinmiyor', ICONS.sun, ICONS_WHITE.sun, 'clear'];
    const temp = getSafe(cur, 'temperature_2m');
    
    $('location-name').textContent = state.name;
    $('current-date').textContent = new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
    $('current-temp').textContent = temp !== null ? Math.round(temp) + '°' : '--°';
    $('current-cond').textContent = condData[0];
    $('current-icon').innerHTML = condData[2]; 
    setWeatherFX(condData[3]);

    // Radar overlay=radar yapıldı. Geçmiş 1 saat ve oynatılabilir timeline özelliği. Marker eklendi.
    const windyModel = state.model.split('_')[0]; 
    $('radar-iframe').src = `https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=8&overlay=radar&product=${windyModel}&level=surface&lat=${state.lat}&lon=${state.lon}&detailLat=${state.lat}&detailLon=${state.lon}&marker=true`;

    renderRightPanel();
    renderMiddlePanel(state.selectedDayIndex);
  }

  function renderRightPanel() {
    const daily = state.currentData.daily || {};
    const days = getSafe(daily, 'time') || [];
    const maxes = getSafe(daily, 'temperature_2m_max') || [];
    const mins = getSafe(daily, 'temperature_2m_min') || [];
    const codes = getSafe(daily, 'weather_code') || [];

    $('forecast-list').innerHTML = days.map((d, i) => {
      let dayName = new Date(d).toLocaleDateString('tr-TR', { weekday: 'short' });
      if(i === 0) dayName = 'Bugün';
      const dayCond = WMO[codes[i]] || ['?', ICONS.sun];
      const isActive = i === state.selectedDayIndex ? 'active' : '';
      const cMin = mins[i] !== undefined && mins[i] !== null ? Math.round(mins[i]) + '°' : '-';
      const cMax = maxes[i] !== undefined && maxes[i] !== null ? Math.round(maxes[i]) + '°' : '-';

      return `
        <button onclick="selectDay(${i})" class="day-btn ${isActive} w-full flex items-center justify-between p-3 sm:p-3.5 rounded-xl cursor-pointer text-sm mb-1">
          <span class="w-16 text-left font-bold text-slate-700">${dayName}</span>
          <div class="w-8 h-8 flex justify-center items-center shrink-0">${dayCond[1]}</div>
          <div class="w-20 text-right flex justify-end gap-2 shrink-0">
            <span class="text-slate-400 font-medium">${cMin}</span>
            <span class="font-bold text-slate-800">${cMax}</span>
          </div>
        </button>
      `;
    }).join('');
  }

  window.selectDay = function(index) {
    state.selectedDayIndex = index;
    renderRightPanel();
    renderMiddlePanel(index);
  }

  function renderMiddlePanel(dayIndex) {
    const data = state.currentData;
    const cur = data.current || {};
    const daily = data.daily || {};
    const hourly = data.hourly || {};
    const aqiData = data.aqi_data || {};
    
    const dates = getSafe(daily, 'time') || [];
    const targetDate = dates[dayIndex] ? new Date(dates[dayIndex]) : new Date();
    
    const dMin = (getSafe(daily, 'temperature_2m_min') || [])[dayIndex];
    const dMax = (getSafe(daily, 'temperature_2m_max') || [])[dayIndex];
    const dCode = (getSafe(daily, 'weather_code') || [])[dayIndex];
    const dCondStr = (WMO[dCode] ? WMO[dCode][0] : 'belirsiz').toLowerCase();
    const dayLabel = dayIndex === 0 ? "Bugün" : targetDate.toLocaleDateString('tr-TR', { weekday: 'long' });
    
    // Günlük Özet
    $('daily-summary-text').textContent = `${dayLabel} hava genel olarak ${dCondStr} olacak. Beklenen en yüksek sıcaklık ${Math.round(dMax)}°C, en düşük ise ${Math.round(dMin)}°C civarında seyredecek.`;

    // Ekstra Göstergeler (Sol Panel Altı)
    const uvMax = (getSafe(daily, 'uv_index_max') || [])[dayIndex];
    const rainHours = (getSafe(daily, 'precipitation_hours') || [])[dayIndex];
    let dailyAqi = null;
    if(aqiData.hourly && aqiData.hourly.european_aqi) {
        let hourIndex = dayIndex * 24 + 12; // Günün ortasındaki AQI (öğlen 12)
        dailyAqi = aqiData.hourly.european_aqi[hourIndex];
    }
    
    $('extra-uv').textContent = uvMax !== null ? uvMax.toFixed(1) : '--';
    $('extra-aqi').textContent = getAqiLabel(dailyAqi);
    $('extra-rainh').textContent = rainHours !== null ? `${rainHours} Saat` : '--';
    $('extra-thunder').textContent = getThunderRisk(dCode);

    // Parametre Kartları
    if(dayIndex === 0) {
      $('middle-title').textContent = 'Bugün';
      const appTemp = getSafe(cur, 'apparent_temperature');
      const windSpeed = getSafe(cur, 'wind_speed_10m');
      const relHum = getSafe(cur, 'relative_humidity_2m');
      const precip = getSafe(cur, 'precipitation');

      $('param-temp-label').textContent = 'Hissedilen';
      $('param-temp-val').textContent = appTemp !== null ? Math.round(appTemp) + '°' : '--°';
      $('param-wind-val').innerHTML = windSpeed !== null ? `${Math.round(windSpeed)}<span class="text-[11px] text-slate-500 font-medium ml-1">km/s</span>` : '--';
      $('param-hum-label').textContent = 'Anlık Nem';
      $('param-hum-val').textContent = relHum !== null ? Math.round(relHum) + '%' : '--%';
      $('param-precip-val').innerHTML = precip !== null ? `${precip.toFixed(1)}<span class="text-[11px] text-slate-500 font-medium ml-1">mm</span>` : '--';
    } else {
      $('middle-title').textContent = dayLabel;
      const dWind = (getSafe(daily, 'wind_speed_10m_max') || [])[dayIndex];
      const dPrecip = (getSafe(daily, 'precipitation_sum') || [])[dayIndex];

      $('param-temp-label').textContent = 'Min - Max';
      $('param-temp-val').textContent = (dMin !== undefined && dMax !== undefined) ? `${Math.round(dMin)}° / ${Math.round(dMax)}°` : '--°';
      $('param-wind-val').innerHTML = dWind !== undefined ? `${Math.round(dWind)}<span class="text-[11px] text-slate-500 font-medium ml-1">Maks</span>` : '--';
      $('param-hum-label').textContent = 'Tahmini';
      $('param-hum-val').textContent = '--'; 
      $('param-precip-val').innerHTML = dPrecip !== undefined ? `${dPrecip.toFixed(1)}<span class="text-[11px] text-slate-500 font-medium ml-1">mm</span>` : '--';
    }

    // Saatlik Grafik
    const hTime = getSafe(hourly, 'time') || [];
    const hTemp = getSafe(hourly, 'temperature_2m') || [];
    const hCode = getSafe(hourly, 'weather_code') || [];
    const hWind = getSafe(hourly, 'wind_speed_10m') || [];
    
    const startIndex = dayIndex * 24;
    const endIndex = startIndex + 24;
    let hourlyHTML = '';
    const currentHour = new Date().getHours();

    for(let i = startIndex; i < endIndex; i++) {
      if(!hTime[i]) break;
      const hourDate = new Date(hTime[i]);
      const hourNum = hourDate.getHours();
      const timeStr = hourNum.toString().padStart(2, '0') + ':00';
      const wC = WMO[hCode[i]] || ['?', ICONS.sun];
      const isPast = (dayIndex === 0 && hourNum < currentHour);
      const op = isPast ? 'opacity-50' : 'opacity-100';
      const bg = (dayIndex === 0 && hourNum === currentHour) ? 'bg-sky-100/90 border-sky-300 ring-1 ring-sky-300' : 'bg-white/70 border-white/90';
      const hT = hTemp[i] !== null ? Math.round(hTemp[i]) + '°' : '-';
      const hW = hWind[i] !== null ? Math.round(hWind[i]) : '-';

      hourlyHTML += `
        <div class="min-w-[70px] sm:min-w-[80px] p-3 sm:p-4 flex flex-col items-center justify-center border rounded-2xl snap-center shrink-0 ${op} ${bg} transition-all shadow-sm">
          <span class="text-[10px] sm:text-[11px] text-slate-500 font-bold mb-2">${timeStr}</span>
          <div class="w-6 h-6 sm:w-8 sm:h-8 mb-2">${wC[1]}</div>
          <span class="text-base sm:text-lg font-bold text-slate-800 mb-0.5">${hT}</span>
          <span class="text-[9px] sm:text-[10px] font-medium text-slate-500">${hW} km/s</span>
        </div>
      `;
    }
    const container = $('hourly-container');
    container.innerHTML = hourlyHTML;
    
    if(dayIndex === 0) {
      setTimeout(() => {
        const itemWidth = window.innerWidth < 640 ? (70+12) : (80+12);
        container.scrollTo({ left: Math.max(0, (currentHour - 1) * itemWidth), behavior: 'smooth' });
      }, 150);
    } else {
      container.scrollTo({ left: 0, behavior: 'smooth' });
    }
  }

  async function loadWeather(){
    showState('loading');
    state.selectedDayIndex = 0; 
    try {
      const data = await fetchWeather(state.model);
      renderApp(data);
      showState('data'); 
    } catch(err) {
      $('error-state').textContent = 'Verilere ulaşılamıyor. Lütfen tekrar deneyin.';
      showState('error');
    }
  }

  document.querySelectorAll('.model-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.model-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.model = btn.dataset.model;
      loadWeather();
    });
  });

  loadWeather();
})();
</script>
</body>
</html>
